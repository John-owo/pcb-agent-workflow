name: CAM regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cam.txt
      - name: Install pinned CAM dependencies
        run: python -m pip install -r requirements-cam.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check script entry points
        run: |
          python scripts/package_release.py --help
          python scripts/cam-diff/render_compare.py --help
          python scripts/cam-diff/pixel_compare.py --help
          python scripts/cam-diff/check_inner_removals.py --help
