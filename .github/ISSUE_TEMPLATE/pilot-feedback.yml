name: Pilot feedback
description: Report here when you got stuck, found something unclear, or found an error while trying this workflow.
title: "[Pilot] "
labels: ["pilot-feedback", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying it. Please do **not** post: names, emails, phone numbers, addresses, national ID numbers, JLC order or cart numbers, GNSS position coordinates, or screenshots containing any of these. When you need an example, use a placeholder such as `<order number>`.
  - type: dropdown
    id: task
    attributes:
      label: Which task were you doing
      options:
        - Following getting-started up to exporting manufacturing files
        - Drafting a customer service email with jlc-support
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Your experience level
      options:
        - Never made a board
        - Can use KiCad, never used an agent
        - Can use KiCad and have used an agent
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, KiCad version, agent used (Claude Code or Codex)
      placeholder: Windows 11, KiCad 10.0.6, Claude Code
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where you got stuck
      description: Which doc, which step, what you did, what you saw. Paste error messages as text.
    validations:
      required: true
  - type: dropdown
    id: blocking
    attributes:
      label: Does it block you from finishing the task
      options:
        - Yes, I can't continue
        - No, but it was confusing or time-consuming
        - No, just a suggestion
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: How do you think it should change (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirm
      options:
        - label: I have not posted personal data, order numbers, or position coordinates
          required: true
